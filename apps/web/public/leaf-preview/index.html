<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liście, 10 propozycji</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #041910;
        color: #e7fff1;
        font-family: Helvetica, Arial, sans-serif;
      }
      header {
        max-width: 1180px;
        margin: 0 auto;
        padding: 36px 24px 8px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      p {
        margin: 8px 0 0;
        max-width: 42rem;
        color: rgba(231, 255, 241, 0.72);
        line-height: 1.45;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 20px 24px 48px;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 18px;
        background: #062a21;
      }
      figcaption {
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.35;
        color: rgba(231, 255, 241, 0.8);
      }
      strong {
        color: #fff;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>10 liści</h1>
      <p>Pojedyncze, duże, bliżej tamtej grafiki. Strony jeszcze nie podmieniam. Napisz numer.</p>
    </header>
    <main>
      <figure>
        <img src="01.png" alt="Liść 01, szeroki i gładki" />
        <figcaption><strong>01</strong> szeroki, gładki</figcaption>
      </figure>
      <figure>
        <img src="02.png" alt="Liść 02, z nerwem środkowym" />
        <figcaption><strong>02</strong> z nerwem środkowym</figcaption>
      </figure>
      <figure>
        <img src="03.png" alt="Liść 03, bardzo szeroka blaszka" />
        <figcaption><strong>03</strong> bardzo szeroka blaszka</figcaption>
      </figure>
      <figure>
        <img src="04.png" alt="Liść 04, owal z jednym nerwem" />
        <figcaption><strong>04</strong> owal, jeden nerw</figcaption>
      </figure>
      <figure>
        <img src="05.png" alt="Liść 05, miękki i zaokrąglony" />
        <figcaption><strong>05</strong> miękki, zaokrąglony</figcaption>
      </figure>
      <figure>
        <img src="06.png" alt="Liść 06, z bocznymi nerwami" />
        <figcaption><strong>06</strong> boczne nerwy</figcaption>
      </figure>
      <figure>
        <img src="07.png" alt="Liść 07, sercowaty z gęstymi nerwami" />
        <figcaption><strong>07</strong> sercowaty, gęste nerwy</figcaption>
      </figure>
      <figure>
        <img src="08.png" alt="Liść 08, wygięty" />
        <figcaption><strong>08</strong> wygięty</figcaption>
      </figure>
      <figure>
        <img src="09.png" alt="Liść 09, prosty klasyczny" />
        <figcaption><strong>09</strong> prosty, klasyczny</figcaption>
      </figure>
      <figure>
        <img src="10.png" alt="Liść 10, klasyczny z ogonkiem" />
        <figcaption><strong>10</strong> klasyczny, z ogonkiem</figcaption>
      </figure>
    </main>
  </body>
</html>
